name: Demos on GitHub Pages

# Publishes the dashboard in demo mode (sample data, simulated shoppers, no API) to
# https://<owner>.github.io/<repo>/, and the shopper app's web demo to .../<repo>/app/.
# Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @smart-cart/dashboard... --filter @smart-cart/mobile...
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @smart-cart/dashboard build:demo
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: pnpm --filter @smart-cart/mobile build:web-demo
      - run: cp -r apps/mobile/dist-web apps/dashboard/out/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
