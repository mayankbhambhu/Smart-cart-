[project]
name = "smartcart"
version = "0.1.0"
description = "Smart Cart API: carts, catalogue, inventory and real-time events (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "python-socketio>=5.17,<6",
    "redis>=8.1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "stripe>=16.0.0",
    "anthropic>=2.1.0",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "ruff>=0.14",
    "mypy>=1.18",
    "aiohttp>=3.14.5",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and Redis with the seed loaded"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# python-socketio ships no type hints.
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smartcart.realtime"]
disallow_untyped_decorators = false
